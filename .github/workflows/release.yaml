name: Test & Build & Push Docker Image to Docker Hub

on:
  release:
    types: [published] # Trigger only when a release is published
  # push:
  #   branches:
  #     - development # this will also run after a branch merge into development
  pull_request:
    branches:
      - development
  #   types:
  #     - closed

jobs:
  build-and-publish-docker-image:
    needs: build-and-publish-package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: ~/.cache/docker
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build the Docker image
        run: |
          docker build -f docker/dockerfile -t ${{ secrets.DOCKER_USERNAME }}/dotnet-web-api:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/dotnet-web-api:latest . --progress=plain

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/dotnet-web-api --all-tags

  test-build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup .NET SDK 9.0
      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
        
      - name: Restore and Build for .NET SDK 9.0
        working-directory: ./App-Api
        run: |
          ls -lsa
          dotnet publish -p:NetCoreTargetFramework=net9.0 WebApi.csproj -f net9.0 -c Release -o ./api

      - name: Create release artifact (e.g., a zip file)
        run: zip -r dotnet-web-api.zip api/ README.md # Adjust based on your project's output

      # - name: Upload Release Asset
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
      #   with:
      #     upload_url: ${{ github.event.release.upload_url }}
      #     asset_path: ./dotnet-web-api.zip
      #     asset_name: dotnet-web-api-${{ github.event.release.tag_name }}.zip
      #     asset_content_type: application/zip

  build-and-publish-package:
    needs: test-build-and-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_PACKAGE_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest