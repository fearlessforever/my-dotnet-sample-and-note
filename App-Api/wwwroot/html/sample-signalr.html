<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample SignalR ~ Realtime Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
      #socket-contents{
        max-height: 500px;
        overflow-y: auto;
      }
      body footer p {
        font-weight: bolder;
        font-style: italic;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
  </head>
  <body class="p-3">
    <header>
      <h1>My Website Header</h1>
    </header>
    <div class="d-flex gap-1">
      <div class="d-flex gap-1">
        <button class="btn btn-success" id="start-socket-connection">Start Connection</button>
        <button class="btn btn-danger" id="stop-socket-connection">Stop Connection</button>
      </div>
      <div class="d-flex gap-3">
        <form class="row g-3 position-relative" style="top: var(--bs-gutter-y);" id="send-message">
          <div class="col-auto mt-0">
            <label for="message-content" class="visually-hidden">Type Message</label>
            <input type="text" name="message" class="form-control" id="message-content" placeholder="Type Message">
          </div>
          <div class="col-auto mt-0">
            <button type="submit" class="btn btn-primary mb-2">Submit Message</button>
          </div>
        </form>
        <!-- <button class="btn btn-primary" id="submit-message">Submit Message</button> -->
      </div>
    </div>

    <div id="socket-contents" class="bg-light my-1" style="min-height: 50px;">

    </div>

    <script type="text/javascript">

    document.addEventListener('DOMContentLoaded',function(){
      const mainElement = document.querySelector('#socket-contents')

      let failToConnectCount = 0 , forcedClose =false

      const socket = new signalR.HubConnectionBuilder()
        .withUrl("/v1/SampleSignalR/real-time") // Replace "/chathub" with your hub's URL
        .configureLogging(signalR.LogLevel.Information) // Optional: Configure logging
        // .withAutomaticReconnect()
        .build();

      socket.on("ReceiveMessage", (message) => {
          // Handle the received message, e.g., update the UI
          console.log(`${message}`);
          const content = document.createElement('div')
          content.innerHTML = `${message}`
          mainElement?.prepend(content)
      });
      socket.on("BroadcastMessage", (message) => {
          const content = document.createElement('div')
          content.innerHTML = `<span class="fw-bolder">Broadcast:</span> <small class="fst-italic">${message}</small>`
          mainElement?.prepend(content)
      });

      let tryingToReconnect = false;
      socket.onreconnecting(function() {
          // Set a flag to indicate that we are in a reconnecting state
          tryingToReconnect = true;
          console.log("Connection lost. Reconnecting...");
      });

      socket.onreconnected(function() {
          // Reset the flag once the connection is re-established
          tryingToReconnect = false;
          console.log("Connection re-established.");
      });

      socket.onclose(function() {
          if (tryingToReconnect) {
              // Only notify the user if the disconnect occurred after a failed reconnect attempt
              console.log("Connection timed out after multiple reconnect failures. Please restart the connection.");
              // Optionally, you can call connection.hub.start() here to try and restart the connection
          }
          const msg = 'Disconnected from WebSocket server.'
          console.log(msg);
          const content = document.createElement('div')
          content.innerHTML = `${msg}`
          mainElement?.prepend(content)

          if(!forcedClose)
            setTimeout(start , 5000)
          else
            forcedClose=false // reset state
      });

      //  window.addEventListener('beforeunload', (event) => {
      //       socket.close()
      //   });


    const startSampleEvent = document.querySelector('#start-socket-connection')
    if(startSampleEvent){
      startSampleEvent.addEventListener('click', function(){
        //alert(1)
        if(socket)
          start()
          // socket.invoke('SendMessage', 'Send Another Event!');
      })
    }

    const stopSampleSocket = document.querySelector('#stop-socket-connection')
    if(stopSampleSocket){
      stopSampleSocket.addEventListener('click', function(){
        if(socket){
          forcedClose=true
          socket.stop()
          startSampleEvent?.removeAttribute('disabled');
        }
      })
    }

    // const sendMessage = document.querySelector('#submit-message')
    const formSendMessage = document.querySelector('#send-message')
    if(formSendMessage){
      formSendMessage.addEventListener('submit', function(e){
        e.preventDefault()
        const formData= new FormData(formSendMessage)
        const message = formData.get('message');
        formSendMessage.reset()
        if(socket)
          socket.invoke('SendMessage', message );
          const content = document.createElement('div')
          content.innerHTML = `You Sent: ${message}`
          mainElement?.prepend(content)
      })
    }


      async function start() {
        const content = document.createElement('div')
        let msg = ''
          try {
              if(startSampleEvent){
                startSampleEvent.setAttribute('disabled','disabled');
              }

              await socket.start();
              msg = "SignalR Connected."
              console.log(msg);
              content.innerHTML = `${msg}`
          } catch (err) {
              console.error("Error connecting to SignalR:", err);
              if(failToConnectCount < 6 ){
                failToConnectCount +=1
                content.innerHTML = `<span class="fw-bolder text-danger">Fail Reconnecting: (${failToConnectCount}) ~ ${ new Date() }</span>`
                setTimeout(start, 5000); // Optional: Retry connection after a delay
              }else{
                msg = "Error connecting to SignalR: Has Failed 5 Times . Please refresh page to reconnect"
                content.innerHTML = `<span class="fw-bolder text-danger">Fail Reconnecting: (${msg}) ~ ${ new Date() }</span>`
                console.error(msg);
                if(startSampleEvent){
                  startSampleEvent.removeAttribute('disabled');
                  failToConnectCount =0
                }
              }
          }
        mainElement?.prepend(content)
      }

    })
      

    </script>
    <footer>
      <p>My Website Footer</p>
  </footer>
  </body>
</html>
