<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample SSE ~ Server Sent Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    
    <style>
      #sse-contents{
        max-height: 500px;
        overflow-y: auto;
      }
      body footer p {
        font-weight: bolder;
        font-style: italic;
      }
    </style>
  </head>
  <body class="p-3">
     <header>
        <h1>My Website Header</h1>
    </header>
    
    <div class="p-3">
      <div class="d-flex gap-3 pb-1">
        <button class="btn btn-primary" id="start-sse">Start SSE</button>
        <button class="btn btn-success" id="stop-sse">Stop SSE (this window only)</button>
        <button class="btn btn-danger" id="stop-sse-all">Stop SSE ( server side , stop all sse )</button>
      </div>
      <div class="row">
        <div class="col-6" id="sse-contents">

        </div>
      </div>
    </div>

    <script type="text/javascript">

    document.addEventListener('DOMContentLoaded',function(){
      let eventSource=null

      const startSSE = function(){
        // const eventSource = new EventSource(`${window.location}/sampleSse`); // Adjust URL if necessary
        const eventSource = new EventSource(`/v1/sampleSse`); // Adjust URL if necessary

        eventSource.onmessage = (event) => {
          const data = JSON.parse(event.data);
          // console.info(data)
          const mainElement = document.querySelector('#sse-contents')
          const content = document.createElement('div')
          content.innerHTML = `${data.Message}`
          mainElement.prepend(content)
          // console.log('Received SSE message:', data.Message);
          // Update UI with the received data
        };

        eventSource.onerror = (error) => {
          console.error('SSE error:', error);
          eventSource.close(); // Close the connection on error

          const mainElement = document.querySelector('#sse-contents')
          const content = document.createElement('div')
          content.innerHTML = `<span class="fw-bold text-danger fst-italic">SSE error: Lost connection to server</span>`
          mainElement.prepend(content)
        };

        return eventSource
      }
      

      const buttonStopAll = document.querySelector('#stop-sse-all')
      if(buttonStopAll){
        buttonStopAll.addEventListener('click', function(){
          if(buttonStart)
            buttonStart.removeAttribute('disabled')

          fetch(`/v1/sampleSse`,{method:'DELETE'}).catch(console.error)
        })
      }

      const buttonStop = document.querySelector('#stop-sse')
      if(buttonStop){
        buttonStop.addEventListener('click', function(){
          eventSource?.close()

          if(buttonStart)
            buttonStart.removeAttribute('disabled')
        })
      }
      const buttonStart = document.querySelector('#start-sse')
      if(buttonStart){
        buttonStart.addEventListener('click', function(){
          eventSource?.close()
          
          eventSource = startSSE()
          buttonStart.setAttribute('disabled','disabled')
        })
      }

    })
      

    </script>
    
    <footer>
      <p>My Website Footer</p>
  </footer>
  </body>
</html>
